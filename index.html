<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>หัวใจของฉัน ❤️</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;

  display: flex;
  justify-content: center;
  align-items: center;

  font-family: sans-serif;
  color: white;

  background:
    radial-gradient(circle at center,
    #55152f 0%,
    #200b19 45%,
    #070309 100%);
}

/* กล่องหลัก */
.container {
  text-align: center;
}

/* หัวใจ */
.heart {
  width: 120px;
  height: 120px;

  position: relative;

  border: none;
  cursor: pointer;

  transform: rotate(-45deg);

  background: linear-gradient(
    135deg,
    #ff8bb5,
    #ff174f
  );

  box-shadow:
    0 0 25px #ff315f,
    0 0 70px rgba(255, 49, 95, .5);

  animation: beat 1s infinite;
}

/* ส่วนกลมของหัวใจ */
.heart::before,
.heart::after {
  content: "";

  position: absolute;

  width: 120px;
  height: 120px;

  border-radius: 50%;

  background: inherit;
}

.heart::before {
  top: -60px;
  left: 0;
}

.heart::after {
  top: 0;
  left: 60px;
}

/* สัญลักษณ์หัวใจ */
.heart span {
  position: absolute;

  z-index: 5;

  left: 43px;
  top: 42px;

  transform: rotate(45deg);

  font-size: 32px;
}

/* ข้อความ */
.message {
  min-height: 55px;

  margin-top: 40px;

  font-size: 23px;
  font-weight: bold;

  color: #fff;

  text-shadow:
    0 0 10px #ff4f86,
    0 0 25px #ff4f86;

  opacity: 0;

  transform: translateY(10px);

  transition: .5s;
}

.message.show {
  opacity: 1;
  transform: translateY(0);
}

/* ข้อความแนะนำ */
.hint {
  margin-top: 10px;

  color: #ffd5e3;

  font-size: 15px;
}

/* หัวใจที่ลอย */
.floating-heart {

  position: fixed;

  bottom: -50px;

  color: #ff5d8f;

  pointer-events: none;

  text-shadow:
    0 0 10px #ff4682;

  animation:
    floatUp 5s linear forwards;
}

/* หัวใจเต้น */
@keyframes beat {

  0%, 100% {
    transform:
      rotate(-45deg)
      scale(1);
  }

  50% {
    transform:
      rotate(-45deg)
      scale(1.12);
  }

}

/* หัวใจลอย */
@keyframes floatUp {

  0% {
    transform:
      translateY(0)
      scale(.6);

    opacity: 0;
  }

  15% {
    opacity: 1;
  }

  100% {
    transform:
      translateY(-110vh)
      rotate(35deg)
      scale(1.3);

    opacity: 0;
  }

}

</style>
</head>


<body>

<div class="container">

  <!-- หัวใจ -->
  <button
    class="heart"
    onclick="showMessage()">

    <span>♥</span>

  </button>


  <!-- ข้อความที่จะปรากฏ -->
  <div
    id="message"
    class="message">

  </div>


  <div class="hint">
    กดที่หัวใจดู ❤️
  </div>

</div>


<script>

function showMessage() {

  const message =
    document.getElementById("message");

  /* ข้อความใหม่ที่คุณต้องการ */
  message.textContent =
    "ขอให้มีความสุขมากๆนะ ❤️";

  message.classList.add("show");


  /* สร้างหัวใจลอย */
  for (let i = 0; i < 20; i++) {

    setTimeout(() => {

      const heart =
        document.createElement("div");

      heart.className =
        "floating-heart";

      heart.textContent = "♥";

      heart.style.left =
        Math.random() * 100 + "vw";

      heart.style.fontSize =
        (15 + Math.random() * 25) + "px";

      heart.style.animationDuration =
        (4 + Math.random() * 3) + "s";

      document.body.appendChild(heart);


      setTimeout(() => {

        heart.remove();

      }, 7000);

    }, i * 80);

  }

}

</script>

</body>
</html>
